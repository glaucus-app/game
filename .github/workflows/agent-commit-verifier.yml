name: Agent Commit Verifier

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify-agent-author:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify agent author
        env:
          REV_RANGE: ${{ github.event_name == 'push' && format('{0}..{1}', github.event.before, github.sha) || format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) }}
        run: |
          set -e
          python3 .github/workflows/verify_author.py "$REV_RANGE"

  verify-signed-commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify signed commits
        env:
          REQUIRE_SIGNED_COMMITS: false
          REV_RANGE: ${{ github.event_name == 'push' && format('{0}..{1}', github.event.before, github.sha) || format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) }}
        run: |
          set -e
          python3 .github/workflows/verify_signatures.py "$REV_RANGE"
